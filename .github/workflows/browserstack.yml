name: Mobile E2E Tests on BrowserStack

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  schedule:
    - cron: '0 0 * * *' # Daily at midnight
  workflow_dispatch:
    inputs:
      app:
        description: 'App to test'
        required: true
        default: 'saucelabs'
        type: choice
        options:
          - saucelabs
          - wikipedia

jobs:
  test:
    name: Run Mobile E2E Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Ensure apps.json exists (or upload dynamically)
        # Assuming apps.json is committed. If not, you'd run node upload-apps.js here.
        # But we'll run it just in case if apps.json isn't tracked in git.
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: node upload-apps.js

      - name: Run WebdriverIO tests on BrowserStack
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
          SAUCE_PASSWORD: ${{ secrets.SAUCE_PASSWORD }}
          APP: ${{ github.event.inputs.app || 'saucelabs' }}
        run: npx wdio run wdio.conf.ts

      - name: Enhance CTRF Report Names
        if: always()
        env:
          APP: ${{ github.event.inputs.app || 'saucelabs' }}
        run: node scripts/enhance-ctrf-report.js

      - name: Merge CTRF Reports
        if: always()
        run: npx ctrf merge ctrf

      - name: Fix CTRF Merge Timestamps
        if: always()
        run: node scripts/fix-merged-ctrf.js


      - name: Generate Custom GitHub Actions Summary
        if: always()
        run: node scripts/generate-github-summary.js

      - name: Generate CTRF HTML Report
        if: always()
        run: |
          node -e "const fs = require('fs'); const file = 'node_modules/ctrf-html-reporter/dist/reporter/.vitepress/config.ts'; let content = fs.readFileSync(file, 'utf8'); content = content.replace('export default defineConfig({', 'export default defineConfig({\n  base: \'/mobile-native-app-automation/\',').replace('title: \"CTCF HTML Reporter\"', 'title: \"CTRF HTML Reporter\"').replace(/sidebar:\s*\[[\s\S]*?\]\s*,/g, 'sidebar: false,'); fs.writeFileSync(file, content);"
          npx ctrf-html-reporter ctrf/ctrf-report.json

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctrf-html-report
          path: .ctrf/report/
          retention-days: 30

      - name: Upload GitHub Pages Artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: .ctrf/report

      - name: Generate HTML Email Body
        if: always()
        run: node scripts/generate-email.js

      - name: Send Email Notification
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Mobile Native Automation Report"
          to: ${{ secrets.NOTIFICATION_EMAILS }}
          from: Mobile QE Bot
          html_body: file://email-body.html

  deploy:
    name: Deploy to GitHub Pages
    if: always()
    needs: test
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
